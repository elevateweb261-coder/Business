<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0e0c">
  <title>Metamorf — Nutriție și fitness, în ritmul tău</title>
  <meta name="description" content="Descoperă interfața Metamorf: planuri alimentare, antrenamente, jurnal alimentar și progres într-un singur loc.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230c0e0c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-size='23' font-weight='bold' fill='%23e8cc7c'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- Scripturi clasice (nu module), ca aplicația să funcționeze și deschisă direct din fișier. Ordinea contează. -->
  <script src="js/utils.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/forms.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/dialogs.js" defer></script>
  <script src="js/events.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Mergi la conținut</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#acasa" aria-label="Metamorf, acasă">
        <img src="metamorf-logo.png" alt="metamorf" width="525" height="137">
      </a>
      <div class="workspace-label">SPAȚIUL TĂU DE WELLNESS</div>
      <nav aria-label="Navigare principală" id="nav"></nav>
      <div class="sidebar-bottom">
        <div class="premium-box">
          <span class="small-icon" data-icon="sparkles"></span>
          <h3>Mai mult pentru tine.</h3>
          <p>Planul complet. Un singur loc.</p>
          <button class="btn lime full" data-view="abonamente">Descoperă Premium</button>
        </div>
        <button class="profile" data-action="profile">
          <span class="avatar" aria-hidden="true"></span>
          <span><strong id="profile-name"></strong><small id="profile-sub"></small></span>
          <span data-icon="settings"></span>
        </button>
        <div class="sidebar-links">
          <button data-action="privacy">Confidențialitate</button>
          <span>·</span>
          <button data-action="terms">Termeni</button>
        </div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-button menu-button" data-action="menu" aria-label="Deschide meniul" aria-expanded="false"><span data-icon="menu"></span></button>
          <span class="breadcrumb"><span class="crumb-root">Spațiul meu <span>/</span> </span><strong id="crumb">Prezentare generală</strong></span>
        </div>
        <div class="top-actions">
          <button class="demo-badge" id="mode-badge" data-action="profile" hidden>Mod demo<span class="badge-extra"> · date exemplu</span></button>
          <button class="icon-button" data-action="notifications" aria-label="Notificări"><span data-icon="bell"></span></button>
          <button class="avatar small" data-action="profile" aria-label="Profilul meu"></button>
        </div>
      </header>

      <main id="content" tabindex="-1">
        <div class="page-state" role="status"><p>Se încarcă Metamorf…</p><noscript>Aplicația are nevoie de JavaScript activat.</noscript></div>
      </main>

      <footer class="main-footer">
        <span>© <span id="year">2026</span> Metamorf. Fiecare pas contează.</span>
        <span id="storage-note">Planuri și valori demonstrative · Datele se păstrează doar în acest browser</span>
      </footer>
    </div>
  </div>

  <div class="mobile-shade" data-action="menu"></div>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <span class="eyebrow">METAMORF</span>
      <button class="icon-button" data-action="close" aria-label="Închide"><span data-icon="close"></span></button>
    </div>
    <div id="dialog-body"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
